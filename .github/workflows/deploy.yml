name: Deploy

# Deployt naar Cloudflare Workers. Staat standaard UIT: zet de repository-variabele DEPLOY_ENABLED op "true"
# en voeg de geheimen CLOUDFLARE_API_TOKEN en CLOUDFLARE_ACCOUNT_ID toe (zie docs/INRICHTING.md).
# Handmatig starten kan altijd via "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
      - run: npx wrangler deploy -c wrangler.vote.jsonc
